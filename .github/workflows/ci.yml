name: CI

on:
  push:
  pull_request:

# The HuRI refs this repository is built and tested against: a git ref (branch
# or tag) of each repository. huri-core: the release tag inside the
# `huri-core>=0.4,<0.5` range of the bridge (its `dev` carries 0.5.0.dev0,
# which it excludes); it moves with the range. huri-modules: `dev`, so a
# breaking change to huri-events shows up here.
env:
  HURI_CORE_REF: "0.4.0"
  HURI_MODULES_REF: dev
  # Never wait for credentials: a wrong ref or a private repo fails at once.
  GIT_TERMINAL_PROMPT: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # [server]: the tests run HuRI's real /session endpoint in-process.
      - name: HuRI core and curated events, at HURI_CORE_REF / HURI_MODULES_REF
        run: |
          python -m pip install --upgrade pip
          pip install \
            "huri-core[server,client] @ git+https://github.com/Lucy-Robotics/huri-core.git@${HURI_CORE_REF}" \
            "huri-events @ git+https://github.com/Lucy-Robotics/huri-modules.git@${HURI_MODULES_REF}#subdirectory=packages/huri-events"
      - run: pip install -e "./bridge[dev]"
      - name: style
        run: |
          black --check .
          isort --check-only .
          flake8
      - name: types
        run: mypy bridge/huri_lucy_bridge
      - run: pytest -q
      - run: huri-lucy-bridge --help
