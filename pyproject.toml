# Tool configuration of the whole repository. The three distributions have
# their own pyproject.toml: module/ (server side), events/ (shared), robot/
# (robot side). Not a package itself.

[tool.pytest.ini_options]
testpaths = ["events/tests", "module/tests", "robot/tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["huri_inmoov", "huri_events_inmoov", "huri_inmoov_robot"]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "arduino"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist", "*.egg-info"]
