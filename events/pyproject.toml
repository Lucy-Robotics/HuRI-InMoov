[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

# The events of the InMoov module, as their own light distribution: the
# robot-side client installs this (not the module) to decode them.
[project]
name = "huri-events-inmoov"
version = "0.1.0"
description = "Events of the HuRI InMoov integration (inmoov.* topics)"
requires-python = ">=3.10"
dependencies = [
  "huri-core>=0.4,<0.5",
  "numpy>=1.26,<2",
]

[project.urls]
Homepage = "https://github.com/Lucy-Robotics/HuRI-InMoov"
Repository = "https://github.com/Lucy-Robotics/HuRI-InMoov"
Issues = "https://github.com/Lucy-Robotics/HuRI-InMoov/issues"

# Topic -> class, in the "inmoov." namespace only ("huri." is reserved).
[project.entry-points."huri.events"]
"inmoov.servo_angles" = "huri_events_inmoov:ServoAngles"

[tool.setuptools.packages.find]
include = ["huri_events_inmoov*"]
